# Continuous integration for the NBK Branch Daily Report.
#
# This runs automatically on every push and on every pull request. Nobody has to
# remember to run the tests: GitHub runs them for you and shows a green tick or a
# red cross next to your commit.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run the unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install -r requirements.txt

      - name: Run the tests
        run: pytest -v
